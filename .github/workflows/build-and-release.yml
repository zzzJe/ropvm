name: Build & Release
run-name: Build and Release ${{ github.ref_name }}

on:
  push:
    tags:
      "v*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup update
          rustup target add ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - run: cargo build --release --target ${{ matrix.target }}
      - run: mv target/${{ matrix.target }}/release/opvm${{ matrix.suffix }} ./opvm-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ./opvm-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - run: |
          mkdir ./artifacts_pure/
          find ./artifacts -mindepth 2 -type f -exec mv {} ./artifacts_pure/ \;
      - uses: ncipollo/release-action@v1
        with:
          artifacts: ./artifacts_pure/*
          name: "OPVM ${{ github.ref_name }} Release"
          bodyFile: "changelog/${{ github.ref_name }}.md"
          prerelease: ${{ contains(github.ref_name, '-') }}
